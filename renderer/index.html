<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>PortalPet</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root">
    <div id="pet" title="클릭해서 열기/닫기">
      <img id="pet-face" src="../theme/tiger_actions/tiger_idle.png" alt="pet" />
      <div id="status-dot" class="idle"></div>
      <!-- K-에듀파인 결재 대기 건수 배지: "결재 건수 확인" 버튼을 눌렀을 때만 값이 채워짐(자동 폴링 없음). -->
      <div id="approval-badge" class="hidden" title="결재 대기 문서"></div>
    </div>

    <div id="panel" class="hidden">
      <div class="panel-header">
        <!-- 여러 지역 선택 기능은 우선 숨김 - 지금은 경기도만 지원. select는 기존 로직 유지를
             위해 DOM에는 남겨두고 화면에서만 숨긴다(값은 항상 goe로 고정). -->
        <select id="region-select" style="display:none">
          <option value="sen">서울</option>
          <option value="goe" selected>경기</option>
          <option value="gne">경남</option>
          <option value="pen">부산</option>
          <option value="dge">대구</option>
          <option value="dje">대전</option>
          <option value="gbe">경북</option>
          <option value="sje">세종</option>
          <option value="use">울산</option>
          <option value="ice">인천</option>
          <option value="gen">광주</option>
          <option value="jne">전남</option>
          <option value="jbe">전북</option>
          <option value="cne">충남</option>
          <option value="cbe">충북</option>
          <option value="gwe">강원</option>
          <option value="jje">제주</option>
          <option value="custom">직접 입력…</option>
        </select>
      </div>
      <div id="portal-home-wrap"></div>
      <div id="services"></div>
      <div id="custom-links-wrap" class="hidden">
        <div class="section-label">자주 가는 사이트</div>
        <div id="custom-links"></div>
      </div>
      <div id="error-box" class="hidden"></div>
      <div class="panel-footer">인증서 로그인 후 나머지 서비스는 자동 연결됩니다</div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
